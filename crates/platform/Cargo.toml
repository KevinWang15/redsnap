[package]
name = "redsnap-platform"
description = "Every OS call RedSnap makes: window show/hide, glass capture, opening things, start at login, single instance, tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
arc-swap = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
icns = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
plist = "1"
interprocess = "2"
log.workspace = true
raw-window-handle = "0.6"
redsnap-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
# The same windows crate gpui uses (COM interfaces for the shell).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "libc",
    "NSApplication",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "CFBase",
    "CFData",
    "CFDictionary",
    "CFMachPort",
    "CFRunLoop",
    "CFString",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "CGColor",
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
    "CGDataProvider",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "NSArray",
    "NSAutoreleasePool",
    "NSData",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSEnumerator",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSValue",
    "block2",
    "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
resvg = { version = "0.45", default-features = false }
x11rb = "0.13"
