[package]
name = "redsnap-platform"
description = "Every OS call RedSnap makes: window show/hide, glass capture, opening things, start at login, single instance, tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
dirs = "6"
icns = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
plist = "1"
interprocess = "2"
log.workspace = true
raw-window-handle = "0.6"
redsnap-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# The same windows crate gpui uses (COM interfaces for the shell).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
resvg = { version = "0.45", default-features = false }
x11rb = "0.13"
