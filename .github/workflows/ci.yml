name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to main gets a full run (the macOS bench takes a while);
  # only superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install gpui's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev libssl-dev
      - run: cargo test --workspace --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Release builds use the committed precompiled shaders (no fxc needed).
      - run: cargo build --release --locked -p redsnap
      - uses: actions/upload-artifact@v4
        with:
          name: redsnap-windows
          path: target/release/redsnap.exe

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # gpui compiles its Metal shaders at build time; newer Xcode versions ship
      # the Metal toolchain as a separate download.
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
      - run: cargo test --workspace --locked
      - name: Build universal release binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p redsnap
          cargo build --release --locked --target x86_64-apple-darwin -p redsnap
      - name: Package RedSnap.app
        run: |
          packaging/macos/package.sh target/macos-bundle \
            target/aarch64-apple-darwin/release/redsnap \
            target/x86_64-apple-darwin/release/redsnap
      - uses: actions/upload-artifact@v4
        with:
          name: redsnap-macos
          path: target/macos-bundle/RedSnap-macos.zip
          compression-level: 0
