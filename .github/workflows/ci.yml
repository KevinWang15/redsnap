name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install gpui's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev libssl-dev
      - run: cargo test --workspace --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Release builds use the committed precompiled shaders (no fxc needed).
      - run: cargo build --release --locked -p redsnap-spike

  # The M0 latency spike on macOS: build, then let it drive itself for a few
  # shows and keystrokes and keep the measurements as an artifact.
  macos-spike:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gpui compiles its Metal shaders at build time; newer Xcode versions ship
      # the Metal toolchain as a separate download.
      - name: Ensure Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p redsnap-spike
      - name: Latency bench
        run: |
          mkdir -p out
          set +e
          for mode in stock now; do
            perl -e 'alarm shift; exec @ARGV' 180 \
              ./target/release/redsnap-spike --bench=20 --paint=$mode --perf=out/bench-macos-$mode.jsonl
            echo "exit status for $mode: $?"
            cat out/bench-macos-$mode.summary.txt || echo "no summary for $mode"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-macos
          path: out/
