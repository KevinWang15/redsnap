[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/platform"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1


[workspace.dependencies]
# The gpui fork (PLAN.md §6.1); RedSnap's changes to gpui are commits there.
gpui = { git = "https://github.com/KevinWang15/gpui", rev = "f6279d5a4597ea1b17de3950fc1d88d18888c46e" }
gpui_platform = { git = "https://github.com/KevinWang15/gpui", rev = "f6279d5a4597ea1b17de3950fc1d88d18888c46e", features = ["font-kit", "x11", "wayland"] }
redsnap-core = { path = "crates/core" }
redsnap-platform = { path = "crates/platform" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
